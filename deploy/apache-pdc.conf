# Serve the Exemplar PDC site from this working tree under http://localhost/pdc/
#
# Install:
#   sudo cp deploy/apache-pdc.conf /etc/apache2/conf-available/pdc.conf
#   sudo a2enconf pdc
#   sudo systemctl reload apache2
#
# Remove:
#   sudo a2disconf pdc && sudo systemctl reload apache2
#
# The pages are PHP (they include partials/header.php and partials/footer.php),
# so the host needs mod_php or php-fpm. Every directory on the path is already
# world-traversable, so www-data can read the tree without changing ownership.

Alias /pdc /mnt/disk1/gemini_code/pdc-exemplar-site

<Directory /mnt/disk1/gemini_code/pdc-exemplar-site>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    DirectoryIndex index.php

    # Optional: serve /pdc/ebook as well as /pdc/ebook.php.
    # If you enable this, also uncomment the site.js fallback note in README —
    # the nav highlight is set server-side and already handles both forms.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /pdc/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME}\.php -f
        RewriteRule ^(.*)$ $1.php [L]
    </IfModule>

    # The partials are included by the pages; block direct requests for them.
    <FilesMatch "^(header|footer|counters)\.php$">
        Require all denied
    </FilesMatch>

    # The counter store and library are internal.
    <DirectoryMatch "/(data|lib)$">
        Require all denied
    </DirectoryMatch>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css               "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType image/png              "access plus 30 days"
        ExpiresByType image/svg+xml          "access plus 30 days"
        ExpiresByType application/pdf        "access plus 30 days"
        ExpiresByType text/html              "access plus 0 seconds"
    </IfModule>
</Directory>
